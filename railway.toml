# Servicio web (Railway lee este archivo por defecto).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/entrypoint.sh web"
healthcheckPath = "/health/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Duerme sin tráfico y despierta con la próxima visita (más barato).
sleepApplication = true
