<form id="prop-{{ p.pk }}" method="post" action="{% url 'juego:votar-proposicion' p.pk %}"
      hx-post="{% url 'juego:votar-proposicion' p.pk %}" hx-target="this" hx-swap="outerHTML"
      hx-disabled-elt="find button"
      class="flex flex-wrap gap-2 mt-2 mono text-xs">
  {% csrf_token %}
  <button name="opinion" value="acuerdo" class="border border-black px-3 py-2 min-h-[40px] hover:bg-black hover:text-white disabled:opacity-50">de acuerdo</button>
  <button name="opinion" value="desacuerdo" class="border border-black px-3 py-2 min-h-[40px] hover:bg-black hover:text-white disabled:opacity-50">en desacuerdo</button>
  <button name="opinion" value="nose" class="border border-gray-400 text-gray-600 px-3 py-2 min-h-[40px] hover:bg-gray-600 hover:text-white disabled:opacity-50">no sé</button>
</form>
