# Cron service: tareas periódicas (reemplaza Celery worker + beat + Redis).
# En Railway: Settings → Config-as-code → railway.cron.toml
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/entrypoint.sh tick"
cronSchedule = "*/15 * * * *"
restartPolicyType = "NEVER"
